# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

include: ["_pages"]

title: Tee Zhi Yao
name: "Tee Zhi Yao"
email: teezhiyao@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  Website documenting learnings and projects
head_scripts: []
teaser: /assets/images/500x300.png

baseurl: "" # the subpath of your site, e.g. /blog
url: "https://teezhiyao.github.io" # the base hostname & protocol for your site, e.g. http://example.com
# url: "http://127.0.0.1:4000"
github_username: teezhiyao
repository: "teezhiyao/teezhiyao.github.io"

# Build settings
remote_theme: "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin: "dark" # "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"

defaults:
  - scope:
      path: ""
      type: pages
    values:
      author_profile: true
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      # read_time: true
      # comments: true
      # share: true
      related: true
  # _portfolio
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: false
      share: true

      
author:
  name: "Tee Zhi Yao"
  avatar: "/assets/images/Tee_Zhi_Yao_photo.jpg"
  bio: "Graduated from SUTD in 2020. QA engineer focused on payment systems, SaaS platforms, and automation testing." # Note: Markdown is allowed
  location: "Singapore"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-inbox"
      url: "teezhiyao@gmail.com"
    - label: "Website"
      icon: "fas fa-fw fa-link"
      url: "https://teezhiyao.github.io/"
    - label: "Linkedin"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/teezhiyao/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/teezhiyao"

footer:
  links:
    - label: "Website"
      icon: "fas fa-fw fa-link"
      url: "https://teezhiyao.github.io/"
    - label: "Linkedin"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/teezhiyao/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/teezhiyao"

collections:
  portfolio:
    output: true
    permalink: /:collection/:path/


plugins:
  - jekyll-feed
  - jekyll-include-cache

baseURL: https://teezhiyao.github.io
languageCode: en
title: "Tee Zhi Yao"
theme: github.com/hugo-toha/toha/v4

# Module imports for Hugo Modules
module:
  imports:
    - path: github.com/hugo-toha/toha/v4

# Permalink structure
permalinks:
  posts: /posts/:slug/
  notes: /notes/:slug/

# Languages
languages:
  en:
    languageName: English
    weight: 1

# Toha-specific parameters
params:
  # Hero section
  hero:
    enable: true
    subtitle: QA Engineer | OMSCS Student | Homelab Enthusiast

  # Features
  features:
    darkMode:
      enable: true
      default: dark
    portfolio:
      enable: true
    blog:
      enable: true
      title: Posts
    notes:
      enable: false
      title: Archive
    toc:
      enable: true
    backToTop:
      enable: true
    readingTime:
      enable: true

  # Newsletter (disabled)
  newsletter:
    enable: false

  # Top navbar
  topNavbar:
    maxVisibleSections: 8

  # Footer
  footer:
    enable: true

  # Enable blog post (backward compat)
  enableBlogPost: true

# Menus
menu:
  main:
    - name: Home
      url: /
      weight: 1
    - name: Posts
      url: /posts/
      weight: 2
    - name: Tags
      url: /tags/
      weight: 3

# Build timeout for slow devices
timeout: 120s

# Configure markup
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    codeFences: true
    style: dracula

# Use Hugo's built-in RSS
outputFormats:
  RSS:
    mediatype: application/rss+xml
    baseName: feed

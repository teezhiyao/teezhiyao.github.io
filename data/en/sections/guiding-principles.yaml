title: Guiding principles
description: Beliefs and principles developed over time

principles:
  - title: "When you fail to plan, you plan to fail"
    description: "I try to plan deliberately; without planning, avoidable failure is more likely."
  - title: "Everything has a trade-off"
    description: "I try to stay aware that every choice has opportunity cost, and I aim to make intentional decisions based on what matters most."
  - title: "Be in the arena (The Man in the Arena)"
    description: "I try to favour action over passive observation—those who try and risk failure often learn the most."
  - title: "Vulnerability is not weakness"
    description: "I aim to be open about uncertainty or mistakes because that enables learning and real connection."

title: About Me
description: QA Engineer | Systems Thinker | Builder 

summary: |
  I’m a QA Engineer with a strong eye for detail, precision, and system reliability. Beyond testing, I enjoy building things—from self-hosted infrastructure to personal automation pipelines—and understanding how systems work end to end. Currently, I’m pursuing a Master’s degree in Computer Science at Georgia Institute of Technology while exploring side projects across software engineering, automation, and infrastructure. I believe in continuous learning, documenting my journey, and building systems that solve real problems. This year, I’ve been guided by the theme of doing things in moderation — pursuing growth with intention, moderation, and balance.

principles:
  - title: "When you fail to plan, you plan to fail"
    description: "I try to plan deliberately; without planning, avoidable failure is more likely."
  - title: "Everything has a trade-off"
    description: "I try to stay aware that every choice has opportunity cost, and I aim to make intentional decisions based on what matters most."
  - title: "Be in the arena (The Man in the Arena)"
    description: "I try to favour action over passive observation—those who try and risk failure often learn the most."
  - title: "Communication builds trust"
    description: "I strive for clear, honest communication — listening and respectful responses build mutual trust."
  - title: "Vulnerability is strength"
    description: "I aim to be open about uncertainty or mistakes because that enables learning and real connection."
  - title: "Practice consistency and empathy"
    description: "I try to act in alignment with my values, treat people fairly, and avoid double standards."


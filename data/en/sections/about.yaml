title: About Me
description: QA Engineer | OMSCS Student | Homelab Enthusiast

summary: |
  I'm a QA/Performance Testing Engineer with a passion for automation, AI, and building things. Currently pursuing a Master's degree in Computer Science at Georgia Tech while working on side projects ranging from self-hosted infrastructure to personal automation pipelines. I believe in continuous learning, documenting my journey, and building systems that solve real problems—all pursued with intention and balance. Everything I do is anchored by "적당히 하" (doing things in moderation), a philosophy of purposefulness and equilibrium.


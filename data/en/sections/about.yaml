title: About Me
description: QA Engineer | Systems Thinker | Builder 

summary: |
  I’m a QA Engineer with a strong eye for detail, precision, and system reliability. Beyond testing, I enjoy building things—from self-hosted infrastructure to personal automation pipelines—and understanding how systems work end to end. Currently, I’m pursuing a Master’s degree in Computer Science at Georgia Institute of Technology while exploring side projects across software engineering, automation, and infrastructure. I believe in continuous learning, documenting my journey, and building systems that solve real problems. This year, I’ve been guided by the theme of doing things in moderation — pursuing growth with intention, moderation, and balance.

